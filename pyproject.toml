[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-major-event-log"
description = "Major Event Log App for Django."
readme = "README.md"
version = "6.0.0"
license = {file = 'LICENSE'}
keywords = ["django", "major", "event", "log"]
requires-python = ">=3.12,<3.15"
authors = [
  { name = "University of North Texas Libraries", email = "mark.phillips@unt.edu" }
]
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application"
]
dependencies = [
    "Django~=6.1.0",
    "lxml>=4.6.2"
]

[project.urls]
Homepage = "https://github.com/unt-libraries/django-major-event-log"
Repository = "https://github.com/unt-libraries/django-major-event-log.git"


[project.optional-dependencies]
test = [
    "pytest>=7.1.0",
    "pytest-django>=4.6.2",
    "ruff~=0.15.9",
]

[tool.ruff]
line-length = 99
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings.test"
python_files = "tests.py"

[tool.tox]
legacy_tox_ini = """
    [tox]
    envlist =
        py{312,313,314}
        py314-ruff
    skip_missing_interpreters = true

    [testenv]
    extras =
        test
    commands = 
        pytest

    [testenv:py314-ruff]
    deps =
        ruff
    commands =
        ruff check .
"""